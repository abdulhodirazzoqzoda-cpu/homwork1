<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
    <div class="header-logo">
        <img src="./images/Logo (3).png" alt="Logo">
    </div>

    <nav class="header-list">
        <p>Início</p>
        <p>Sobre</p>
        <p>Serviços</p>
        <p>Depoimentos</p>
        <p>Contato</p>
    </nav>

    <div class="header-menu">
        <img src="./images/Icon (6).png" alt="Menu">
    </div>
</header>
<section class="hero">

    <div class="hero-text">
        <h1>Saúde natural para<br>os seus cabelos</h1>

        <p>
            Um salão exclusivo em São Paulo,
            especializado em tratamentos naturais.
        </p>

        <a href="#contato" class="hero-button">
            Agendar um horário
        </a>
    </div>

    <div class="hero-image">
        <div class="hero-bg"></div>

        <img src="./images/Img.png" alt="Hair salon">
    </div>

</section>
    
</body>
</html>
